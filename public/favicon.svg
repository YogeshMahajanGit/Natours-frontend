<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Deep Forest Green Circle -->
  <circle cx="50" cy="50" r="48" fill="#1F3D2B" stroke="#A8541F" stroke-width="4"/>
  
  <!-- Inner Ring Accent -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#2E5940" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Cardinal Compass Points -->
  <circle cx="50" cy="18" r="2.5" fill="#FBBF24"/>
  <circle cx="82" cy="50" r="2.5" fill="#F7F4EC"/>
  <circle cx="50" cy="82" r="2.5" fill="#F7F4EC"/>
  <circle cx="18" cy="50" r="2.5" fill="#F7F4EC"/>

  <!-- Compass North Pointer (Burnt Clay & Amber) -->
  <polygon points="50,22 57,50 50,45 43,50" fill="#A8541F"/>
  <polygon points="50,22 50,45 43,50" fill="#FBBF24"/>

  <!-- Compass South Pointer (Warm Paper & Moss) -->
  <polygon points="50,78 57,50 50,55 43,50" fill="#F7F4EC"/>
  <polygon points="50,78 50,55 43,50" fill="#2E5940"/>

  <!-- Center Pivot Pin -->
  <circle cx="50" cy="50" r="4" fill="#FBBF24" stroke="#1F3D2B" stroke-width="1.5"/>
</svg>